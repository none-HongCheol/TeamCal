<h1>TeamCal</h1>
<p>팀 휴가 캘린더와 내 구글 캘린더 일정을 Windows 바탕화면에서 한눈에 보는 팀 내부용 데스크톱 위젯입니다.</p>
<ul>
  <li>팀원 휴가를 날짜별 점으로 표시하고, 위젯에서 바로 휴가를 등록합니다.</li>
  <li>구글 계정으로 로그인하면 앞으로 2주간의 내 일정을 보여주고, 위젯에서 일정을 추가할 수 있습니다.</li>
  <li>모든 정보는 사용자 PC와 각 서비스(구글, 팀 휴가 캘린더) 사이에서만 오가며, 제작자가 수집하지 않습니다.</li>
</ul>
